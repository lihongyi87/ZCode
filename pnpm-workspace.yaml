packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true

# pnpm 10.7+ 的新配置家：package.json 的 "pnpm" 键已被忽略（安装时警告实锤）。
# 从根 package.json 迁移而来；CE 守卫测试（arms-patch-install-contract）要求补丁实际生效。
overrides:
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "unzipper": "0.12.5"
patchedDependencies:
  "@ai-sdk/openai-compatible@2.0.60": "patches/@ai-sdk__openai-compatible@2.0.60.patch"
  "@ai-sdk/anthropic@3.0.81": "patches/@ai-sdk__anthropic@3.0.81.patch"
  "wdio-electron-service@9.2.1": "patches/wdio-electron-service@9.2.1.patch"
  "@arms/rum-electron@0.0.3": "patches/@arms__rum-electron@0.0.3.patch"
  # v3.17.1：office 预览链补丁（react-xlsx 链接出口/pptx 渲染器/collapsible；上游 vitest@4.1.7 patch 不适用本仓 4.1.11）
  "@extend-ai/react-xlsx@0.16.0": "patches/@extend-ai__react-xlsx@0.16.0.patch"
  "@aiden0z/pptx-renderer@1.2.4": "patches/@aiden0z__pptx-renderer@1.2.4.patch"
  "@radix-ui/react-collapsible@1.1.12": "patches/@radix-ui__react-collapsible@1.1.12.patch"
